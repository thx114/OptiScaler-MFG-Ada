; OptiScaler MFG Ada 0.2.0 / FG-only
; Existing users should keep their own INI. No internal NR runtime is required.
[Upscalers]
Dx11Upscaler=dlss
Dx12Upscaler=dlss

[FrameGen]
Enabled=false
FGInput=Upscaler
FGOutput=DLSSG

[DLSSG]
AdaMfgUnlock=true
InterpolationCount=1
; Quality patching is opt-in, exact-provider matched, and requires restarting.
MavisQuality=false
MavisWarpBlend=true
MavisIntermediateScatter=true
MavisBoundaryGuard=1
; 0: existing runtime policy, 1: local, 2: OTA (restart required).
RuntimeSelection=0
; 0: Native, 1: Automatic HUD/UI guard, 2: explicitly verified UI recomposition.
InputQuality=0
ReflexOutputFpsCap=0
DepthSeparation=0
SoftPause=true
PausePresentGap=600

[DlssNr]
Enabled=false
FinishedPicture=false

; Launchers pin this to their build-local OptiScaler directory before injection.
[Libraries]
OptiDllPath=auto

[Log]
LogToFile=true
LogLevel=2
LogFileName=OptiScaler.log
